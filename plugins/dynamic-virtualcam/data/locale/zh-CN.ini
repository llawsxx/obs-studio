TestCardOff="关闭 — 使用所选视频输出"
TestCardMotion="运动 — 多周期转针和移动条"
TestCardHelp="可在运行中切换，仅替换当前设备的画面。配合相位滑块观察运动连续性；帧号不变表示重复画面，输出帧率低于 OBS 时跳号可能正常。"
TestCardFailed="测试卡绘制失败 — 请查看 OBS 日志；不会自动切回真实画面。"
Notes="各设备的输出设置互相独立。开启时请允许 UAC 授权；设备仅在开启期间注册。启停后，请刷新接收软件的设备列表。"
State="状态"
Phase="输出相位"
PhaseHelp="调整每个输出周期内实际开始选帧和交付 DirectShow 样本的时刻。范围为 0 ≤ 相位 < 一个周期（60 FPS 时约 0–16.67ms，不含上限）。运行中修改从下一轮调度生效，不改变内部按帧率递增的时间戳，也不直接重设缓冲 offset；这不是显示器 VSync 同步。"
PhaseDetails="相位只改变实际唤醒调度。内部帧时钟按分数帧率递增，不从 QPC 或相位计算；攒够目标帧数时才对齐 OBS 帧时间戳。复制和下游接收仍有耗时，滑块精度不代表物理交付精度。同一设备的接收实例共用相位设置，但缓冲状态和 offset 各自独立。"
Delivered="已交付"
Repeated="重复画面"
Skipped="跳过输入帧"
Lateness="最近交付迟到（ms）"
Streaming="传输中"
Opened="已打开"
Stopped="已停止 — 设备未注册"
Running="已开启 — 当前设备已注册"
Start="开启虚拟摄像头"
Stop="关闭虚拟摄像头"
InvalidRate="请输入 1–1000 FPS 的有效分数帧率（分子、分母不超过 1000000）。"
AlreadyRunning="另一个 OBS 实例正在使用这台虚拟摄像头。"
OutputFailed="无法启动视频输出。请查看 OBS 日志；输出宽高必须为偶数，且不超过 8192 × 8192。"
RegistrationFailed="无法为管理员权限应用注册摄像头。请允许 Windows UAC 授权，并检查插件 data 目录内的 dvc-filter64.dll、dvc-filter32.dll 和 dvc-watchdog.exe。取消授权不会启动设备。"
AddDevice="新增虚拟摄像头"
RenameDevice="重命名设备"
RemoveDevice="移除设备"
DeviceName="设备名称"
StopBeforeRename="请先关闭这台虚拟摄像头，再修改设备名称。"
InvalidDeviceName="设备名称必须唯一，且长度不超过 128 个字符。"
ConfirmRemoveDevice="移除“%1”？如果设备正在运行，将先停止它。其它设备不受影响。"
DeviceStatistics="接收实例：%1（传输中 %2）\n已交付：%3　重复画面：%4　当前实例丢弃旧帧：%5\n最近准备耗时：%6 ms　下游接收耗时：%7 ms\n最大待消费缓冲：%8 帧　重新对齐：%9 次\n交付与重复为本次开启期间各接收实例的累计值。"
PixelFormat="输出格式"
PixelFormatHelp="开启前选择，OBS 完成格式转换后发布，接收软件使用此格式。修改格式需先关闭摄像头。"
FollowObsFps="跟随 OBS 输出帧率（%1/%2）"
BufferTarget="目标缓冲帧数"
BufferMax="最大缓冲帧数"
BufferHelp="攒够目标帧数后才开始或重新对齐输出。缓冲降至 0 后重新攒帧；超过最大帧数时只保留最新的目标帧数，将保留的最老 OBS 帧时间戳对齐到内部帧时钟。在 ±0.6 个输出周期内选择最老的未消费帧。范围为 1–30 帧，目标不大于最大值；帧数越多内存占用越高，修改前需关闭设备。"
