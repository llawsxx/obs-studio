Title="动态虚拟摄像头管理"
ConfirmStopInUseDevice="“%1”仍有接收实例打开。关闭后将中断该设备的视频输出，是否仍要关闭？\n\n选择“否”将保持设备运行。"
ConfirmRemoveInUseDevice="“%1”仍有接收实例打开。移除会先关闭该设备并中断视频输出，是否仍要移除？\n\n其它设备不受影响。"
ConfirmExitInUseDevices="以下虚拟摄像头仍有接收实例打开：\n\n%1\n\n退出 OBS 会关闭所有虚拟摄像头并中断视频输出，是否仍要退出？\n\n选择“否”将保留 OBS 和摄像头运行。"
