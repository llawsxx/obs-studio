BufferMax="Maximum buffered frames"
BufferHelp="Wait for the target frame count before starting or re-aligning playback. After the queue empties, refill to the target. If the maximum is exceeded, keep only the newest target count and re-align the oldest retained OBS timestamp to the internal frame clock. Select the oldest unused frame within +/-0.6 output periods. Range: 1-30 frames; target <= maximum. More frames use more memory. Stop the device before changing these settings."
UseObsInterval="Use OBS fixed frame interval (no remainder accumulation)"
UseObsIntervalHelp="Automatically follows OBS FPS and uses its fixed integer-nanosecond frame interval for the internal clock and delivery schedule. At 60 FPS every interval is 16666666 ns, with no fractional remainder compensation. Disable to use rational frame timing. Stop the device before changing this option."
