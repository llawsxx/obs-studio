State="State"
Phase="Output phase"
PhaseHelp="Moves the actual DirectShow selection/delivery time within each output period. Range: 0 <= phase < one period (about 0-16.67 ms at 60 FPS, excluding the upper limit). Changes apply from the next scheduling cycle without changing the internal frame timestamps or directly resetting the buffer offset. This is not monitor VSync synchronization."
PhaseDetails="Phase changes only the wake-up schedule. The internal clock advances by the exact fractional frame rate, independently of QPC and phase. OBS timestamps are aligned when the target buffer count is reached. Copying and downstream Receive still take time, so slider precision does not guarantee physical arrival precision. All receivers of this device share the phase setting but maintain independent buffers and offsets."
